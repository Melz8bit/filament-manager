<div id="spool-{{ spool.pk }}"
     class="bg-white rounded-xl border border-red-200 shadow-sm overflow-hidden flex flex-col dark:bg-gray-800 dark:border-red-900">
    <div class="p-4">
        <div class="flex items-start gap-3">
            <div class="w-11 h-11 rounded-full flex-shrink-0 ring-2 ring-red-200 dark:ring-red-800"
                 style="background-color: {{ spool.color_hex }}"></div>
            <div>
                <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">Delete this spool?</p>
                <p class="mt-0.5 text-sm text-gray-500 dark:text-gray-400">{{ spool }}</p>
                <p class="mt-2 text-xs text-gray-400 dark:text-gray-500">This cannot be undone. Print history using this spool will remain.</p>
            </div>
        </div>
        <div class="mt-4 flex items-center gap-2">
            <form method="post" action="{% url 'spool-delete' spool.pk %}" class="contents">
                {% csrf_token %}
                <button type="submit"
                        hx-post="{% url 'spool-delete' spool.pk %}"
                        hx-target="#spool-{{ spool.pk }}"
                        hx-swap="delete"
                        class="rounded-md bg-red-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-red-700 transition-colors">
                    Confirm Delete
                </button>
            </form>
            <button hx-get="{% url 'spool-card' spool.pk %}"
                    hx-target="#spool-{{ spool.pk }}"
                    hx-swap="outerHTML"
                    class="rounded-md bg-white border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700">
                Cancel
            </button>
        </div>
    </div>
</div>
