{% with ps=slot.print_spool %}
<div id="slot-{{ ps.pk }}" class="p-4">

    <!-- Main row: swatch + selector + Split button -->
    <div class="flex items-center gap-4">

        <!-- Slicer color swatch + grams -->
        <div class="flex-shrink-0 text-center">
            <div class="w-10 h-10 rounded-full ring-2 ring-offset-2 ring-gray-200 mx-auto dark:ring-gray-700 dark:ring-offset-gray-800"
                style="background-color: {{ ps.slicer_hex }}"></div>
            <p class="mt-1 text-xs text-gray-400 dark:text-gray-500">{{ ps.grams_used|floatformat:1 }}g</p>
        </div>

        <!-- Spool selector + Split button -->
        <div class="flex-1 min-w-0">
            <label for="spool_{{ ps.pk }}" class="flex items-center gap-2 text-xs font-medium text-gray-500 mb-1 dark:text-gray-400">
                {{ ps.slicer_hex }}
                <span id="insufficient-badge-{{ ps.pk }}"
                      class="{% if not slot.insufficient %}hidden {% endif %}inline-flex items-center gap-1 rounded px-1.5 py-0.5 text-xs font-semibold bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-400">
                    ⚠ Not enough remaining
                </span>
            </label>
            <div class="flex items-center gap-2">
                <select id="spool_{{ ps.pk }}"
                    name="spool_{{ ps.pk }}"
                    data-needed="{{ ps.grams_used }}"
                    onchange="checkSpoolCapacity(this, {{ ps.grams_used }}, '{{ ps.pk }}')"
                    class="block flex-1 min-w-0 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm dark:bg-gray-900 dark:text-gray-100 dark:placeholder-gray-500 bg-white text-gray-900 placeholder-gray-400 {% if slot.insufficient %}ring-2 ring-red-400 border-red-400 dark:border-red-600{% else %}border-gray-300 dark:border-gray-600{% endif %}">
                    <option value="">— Unassigned —</option>
                    {% for spool in slot.spools %}
                    <option value="{{ spool.pk }}"
                            data-remaining="{{ spool.remaining_g }}"
                            {% if spool.pk == slot.best_pk %}selected{% endif %}>
                        {{ spool.brand }} — {{ spool.color_name }} ({{ spool.material }}){% if spool.sku %} [{{ spool.sku }}]{% endif %} · {{ spool.remaining_g|floatformat:0 }}g left
                    </option>
                    {% endfor %}
                </select>
                <button type="button"
                    hx-get="{% url 'spool-slot-split' ps.pk %}"
                    hx-target="#slot-{{ ps.pk }}"
                    hx-swap="outerHTML"
                    class="flex-shrink-0 rounded-md border border-gray-300 bg-white px-4 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50 transition-colors dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600 dark:hover:bg-gray-700">
                    Split
                </button>
            </div>
        </div>

    </div>

    <!-- Continuation spool section — shown when selected spool can't cover the full amount -->
    <div id="cont-{{ ps.pk }}" class="{% if not slot.insufficient %}hidden {% endif %}mt-3 rounded-md bg-amber-50 border border-amber-200 p-3 dark:bg-amber-950 dark:border-amber-800">
        <p class="text-xs font-medium text-amber-800 mb-2 dark:text-amber-300">
            ⚠️ <span id="cont-warn-{{ ps.pk }}">{% if slot.insufficient %}{{ slot.best_remaining|floatformat:1 }}g left on this spool — {{ slot.shortfall|floatformat:1 }}g will come from a replacement spool.{% endif %}</span>
        </p>
        <label for="cont-spool-{{ ps.pk }}" class="block text-xs font-medium text-gray-600 mb-1 dark:text-gray-400">
            Replacement spool (picks up where the first runs out)
        </label>
        <select id="cont-spool-{{ ps.pk }}"
                name="continuation_spool_{{ ps.pk }}"
                onchange="updateContGrams('{{ ps.pk }}', {{ ps.grams_used }})"
                class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm dark:border-gray-600 bg-white text-gray-900 placeholder-gray-400 dark:bg-gray-900 dark:text-gray-100 dark:placeholder-gray-500">
            <option value="">— Select replacement spool —</option>
            {% for spool in slot.spools %}
            <option value="{{ spool.pk }}" data-remaining="{{ spool.remaining_g }}">
                {{ spool.brand }} — {{ spool.color_name }} ({{ spool.material }}){% if spool.sku %} [{{ spool.sku }}]{% endif %} · {{ spool.remaining_g|floatformat:0 }}g left
            </option>
            {% endfor %}
        </select>
        <p id="cont-grams-{{ ps.pk }}" class="hidden mt-1.5 text-xs text-gray-500 dark:text-gray-400"></p>
    </div>

</div>

<script>
// Auto-check capacity for the pre-selected spool on page load
(function () {
    var sel = document.getElementById('spool_{{ ps.pk }}');
    if (sel && sel.value) checkSpoolCapacity(sel, {{ ps.grams_used }}, '{{ ps.pk }}');
})();
</script>
{% endwith %}
