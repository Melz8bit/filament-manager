<div id="spool-{{ spool.pk }}"
     class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col dark:bg-gray-800 dark:border-gray-700">

    <!-- Identity row -->
    <div class="flex items-center gap-3 p-4">
        <div class="w-11 h-11 rounded-full flex-shrink-0 ring-2 ring-offset-2 ring-gray-200 dark:ring-gray-700 dark:ring-offset-gray-800"
             style="background-color: {{ spool.color_hex }}"></div>
        <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-1.5">
                <span class="font-semibold text-gray-900 truncate dark:text-gray-100">{{ spool.brand }}</span>
                <span class="text-xs px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-600 flex-shrink-0 dark:bg-gray-700 dark:text-gray-400">{{ spool.material }}</span>
                {% if spool.is_low_stock %}
                <span class="text-xs px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-700 font-medium flex-shrink-0 dark:bg-amber-900 dark:text-amber-400">Low</span>
                {% endif %}
            </div>
            <p class="text-sm text-gray-500 truncate dark:text-gray-400">{{ spool.color_name }}</p>
        </div>
    </div>

    <!-- Progress bar -->
    <div class="px-4 pb-4">
        <div class="flex justify-between text-xs text-gray-500 mb-1.5 dark:text-gray-400">
            <span>{{ spool.remaining_g|floatformat:0 }}g left</span>
            <span>{{ spool.remaining_percent }}%</span>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-2 dark:bg-gray-700">
            <div class="h-2 rounded-full transition-all duration-300 {% if spool.is_low_stock %}bg-amber-400{% else %}bg-indigo-500{% endif %}"
                 style="width: {{ spool.remaining_percent }}%"></div>
        </div>
        <p class="text-xs text-gray-400 mt-1 dark:text-gray-500">of {{ spool.full_weight_g }}g full</p>
    </div>

    <!-- Action bar -->
    <div class="mt-auto border-t border-gray-100 flex divide-x divide-gray-100 dark:border-gray-700 dark:divide-gray-700">
        <a href="{% url 'spool-edit' spool.pk %}"
           class="flex-1 py-2.5 text-center text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-gray-100">
            Edit
        </a>
        <button hx-get="{% url 'spool-delete' spool.pk %}"
                hx-target="#spool-{{ spool.pk }}"
                hx-swap="outerHTML"
                class="flex-1 py-2.5 text-sm text-red-500 hover:bg-red-50 hover:text-red-700 transition-colors dark:text-red-400 dark:hover:bg-red-950 dark:hover:text-red-400">
            Delete
        </button>
    </div>
</div>
